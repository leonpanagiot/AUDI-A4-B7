plugins {
    id 'com.android.application'
}

android {
    namespace 'gr.audi.bfblive'
    compileSdk 34

    defaultConfig {
        applicationId "gr.audi.bfblive"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
}

task buildWebAssets(type: Exec) {
    workingDir '../../'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build && powershell -Command "Copy-Item -Path dist\\* -Destination android\\app\\src\\main\\assets -Recurse -Force"'
    } else {
        commandLine 'sh', '-c', 'npm run build && cp -r dist/* android/app/src/main/assets/'
    }
}

preBuild.dependsOn buildWebAssets

