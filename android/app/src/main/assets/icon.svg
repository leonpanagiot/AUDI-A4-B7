<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="85%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="redRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#ff6677"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer background disc -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#222736" stroke-width="8"/>
  <circle cx="256" cy="256" r="228" stroke="url(#redRing)" stroke-width="6" opacity="0.85"/>
  
  <!-- Gauge ticks arc -->
  <path d="M 100 360 A 180 180 0 1 1 412 360" fill="none" stroke="#374151" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 16"/>
  <path d="M 280 100 A 180 180 0 0 1 412 360" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 16" filter="url(#glow)"/>

  <!-- Turbo Charger Impeller blades in center -->
  <g transform="translate(256, 256)" opacity="0.35">
    <circle r="90" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M0,0 Q30,-40 60,-30 M0,0 Q40,-20 70,0 M0,0 Q30,40 50,60 M0,0 Q-20,40 -40,65 M0,0 Q-40,20 -70,10 M0,0 Q-40,-30 -55,-55 M0,0 Q0,-50 15,-75" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Audi 4 rings icon stylized -->
  <g transform="translate(146, 175) scale(0.65)" opacity="0.9">
    <ellipse cx="60" cy="50" rx="36" ry="36" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <ellipse cx="120" cy="50" rx="36" ry="36" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <ellipse cx="180" cy="50" rx="36" ry="36" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <ellipse cx="240" cy="50" rx="36" ry="36" fill="none" stroke="#e2e8f0" stroke-width="7"/>
  </g>

  <!-- BFB badge -->
  <g transform="translate(196, 230)">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <rect x="2" y="2" width="22" height="28" rx="4" fill="#dc2626"/>
    <text x="68" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="19" letter-spacing="3" text-anchor="middle">BFB</text>
  </g>

  <!-- Red Sports Needle -->
  <line x1="256" y1="256" x2="380" y2="170" stroke="url(#needle)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>

  <!-- Live label at bottom -->
  <text x="256" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="6" text-anchor="middle">TELEMETRY</text>
  <circle cx="160" cy="374" r="5" fill="#22c55e" filter="url(#glow)"/>
  <text x="256" y="415" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">LIVE OBD2</text>
</svg>
